<script>
let LANG='ru';
const T=(ru,en)=>LANG==='ru'?ru:en;
const CUTNAMES={fed:{ru:['ЦФО','СЗФО','ЮФО+СКФО','ПФО','УФО','СФО+ДФО'],en:['Central','Northwest','South+N.Caucasus','Volga','Urals','Siberia+Far East']},
 age:{ru:['18–24','25–34','35–44','45–54','55+'],en:['18–24','25–34','35–44','45–54','55+']},
 sex:{ru:['Мужчины','Женщины'],en:['Men','Women']},
 edu:{ru:['Есть высшее','Нет высшего'],en:['Higher edu','No higher edu']},
 emp:{ru:['Работают','Не работают'],en:['Employed','Not employed']},
 occ:{ru:['Владелец бизнеса','Руководитель','Специалист','Технич./обслуж.','Рабочий','Фрилансер/самозанятый','Другое'],en:['Business owner','Manager','Specialist','Tech./service','Blue collar','Freelancer/Self-emp.','Other']},
 income:{ru:['Хорошее','Удовлетворительное','Плохое'],en:['Good','Satisfactory','Poor']}};
const CUTTITLE={age:{ru:'Возраст',en:'Age'},sex:{ru:'Пол',en:'Sex'},fed:{ru:'Округ',en:'Federal district'},edu:{ru:'Образование',en:'Education'},emp:{ru:'Занятость',en:'Employment'},occ:{ru:'Профессия',en:'Occupation'},income:{ru:'Материальное положение',en:'Material situation'}};
const CHARTS={};
function reg(id,fn){const el=document.getElementById(id);if(!el)return;
 let c=CHARTS[id];
 if(c&&c.el.isConnected){}else{if(c){c.chart.dispose()}c={el,chart:echarts.init(el)};CHARTS[id]=c}
 const opt=fn;if(opt)c.chart.setOption(opt,true);c.chart.resize();}
function baseOpt(){const ax={axisLine:{lineStyle:{color:'#3a4657'}},axisLabel:{color:'#8b96a5',fontSize:11},splitLine:{lineStyle:{color:'#20293a'}}};
 return{backgroundColor:'transparent',textStyle:{fontFamily:'inherit'},
  tooltip:{backgroundColor:'#1c232e',borderColor:'#262f3d',textStyle:{color:'#e8ecf1'},confine:true},
  grid:{left:8,right:22,top:34,bottom:8,containLabel:true},
  xAxis:Object.assign({type:'value'},ax,{axisLabel:{color:'#8b96a5',fontSize:10,formatter:'{value}%'}}),
  yAxis:Object.assign({type:'category'},ax,{axisLabel:{color:'#c9d2dd',fontSize:12,width:150,overflow:'truncate'}})}}
function barOpt(cats,vals,color){const o=baseOpt();o.yAxis.data=cats;o.series=[{type:'bar',data:vals,itemStyle:{color:color,borderRadius:[0,4,4,0]},barMaxWidth:22,label:{show:true,position:'right',color:'#aeb8c4',fontSize:11,formatter:p=>p.value+'%'}}];return o}
/* легенда, переносящаяся на мобиле: считаем строки и отодвигаем grid.top */
function legendTop(el,items,fs){fs=fs||10.5;const w=(el&&el.clientWidth)||360;let rows=1,x=0;
 for(const it of items){const iw=String(it).length*fs*0.62+30;const nx=x?x+14+iw:iw;
  if(nx>w&&x>0){rows++;x=iw}else x=nx}
 return rows>1?12+rows*16+6:34}
function kpiHtml(v,l){return `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`}

/* ---------- i18n ---------- */
const NAV=[['aud','Аудитория','Audience'],['habit','Привычки','Habits'],['money','Деньги','Spending'],['family','Семья и стереотипы','Family & stereotypes'],['esport','Киберспорт','Esports'],['hidden','Скрытые закономерности','Hidden patterns']];
function setLang(l){LANG=l;document.getElementById('btnRu').classList.toggle('on',l==='ru');
 document.getElementById('btnEn').classList.toggle('on',l==='en');
 document.documentElement.lang=l;
 renderAll();}
function L(){return LANG}

function renderAll(){renderHeader();renderNav();renderKPIs();buildSkeleton();refresh();}

function renderHeader(){
 document.getElementById('subTitle').textContent=T('интерактивный дашборд по данным НАФИ × РВИ','interactive dashboard based on NAFI × RVI survey');
 document.getElementById('h1').textContent=T('Гейминг в России 2022','Gaming in Russia 2022');
 document.getElementById('lead').textContent=T(
  'Всероссийский репрезентативный опрос НАФИ (апрель 2022, 1600 респондентов 18+, 53 региона, погрешность ±3,4 п.п.). Выберите разрез — и все графики пересчитаются. В разделах — выводы отчёта и комментарии экспертов.',
  'A nationally representative NAFI survey (April 2022, 1,600 respondents 18+, 53 regions, ±3.4pp). Pick a breakdown — every chart recalculates. Key findings and expert commentary from the report included.');
 document.getElementById('btnReset').textContent=T('Сбросить','Reset');
 document.getElementById('lblCut').textContent=T('Разрез','Breakdown');
 document.getElementById('lnkHub').textContent=T('← Все проекты','← All projects');
 document.getElementById('lnk2026').textContent=T('Гейминг в России 2026 →','Gaming in Russia 2026 →');
 document.getElementById('footText').textContent=T(
  'Дашборд построен на агрегированных таблицах данных исследования «Гейминг в России 2022» (НАФИ). Экспертные комментарии — из отчёта РВИ «Видеоигры в России 2022».',
  'Built on the aggregated data tables of "Gaming in Russia 2022" (NAFI). Expert quotes from the RVI report "Video Games in Russia 2022".');
 document.getElementById('method').innerHTML=T(
  '<b>Методология.</b> Всероссийский репрезентативный опрос населения старше 18 лет, апрель 2022. Выборка 1600 человек, 53 региона, ошибка выборки ±3,4 п.п. (95% доверительный интервал). Опрос проведён методом онлайн-интервью. Данные взвешены по полу, возрасту и образованию. Разрезы с базой меньше 100 респондентов показаны как справочные (руководители, владельцы бизнеса).',
  '<b>Methodology.</b> Nationally representative survey of the 18+ population, April 2022. Sample 1,600 respondents, 53 regions, sampling error ±3.4pp. Online methodology; data weighted by sex, age and education. Breakdowns with base under 100 respondents are indicative only.');
}

function renderNav(){
 document.getElementById('nav').innerHTML=NAV.map(([id,ru,en])=>`<a href="#sec-${id}">${T(ru,en)}</a>`).join('');
}

/* ---------- KPI ---------- */
function renderKPIs(){
 const D=window.D22;
 document.getElementById('kpis').innerHTML=[
  kpiHtml('60%',T('играли в видеоигры','played video games')),
  kpiHtml('23%',T('играли каждый день','played every day')),
  kpiHtml('21%',T('не играют, но играют члены семьи','don\'t play, but family does')),
  kpiHtml('74%',T('играли на смартфоне (из игроков)','played on smartphone (of players)')),
  kpiHtml('3,6 ч',T('среднее время в день (играющие)','average daily playtime (players)')),
  kpiHtml('50%',T('считают киберспорт видом спорта','consider esports a real sport')),
 ].join('');

/* ---------- skeleton ---------- */
function secHtml(id,num,ru,en,desc,inner){
 return `<section id="sec-${id}"><h2><span class="num">${num}</span>${T(ru,en)}</h2><p class="secdesc">${T(desc[0],desc[1])}</p>${inner}</section>`;
}
function cardHtml(id,title,base,cls){
 return `<div class="card"><h3 id="t-${id}"></h3><div class="base" id="b-${id}"></div><div class="chart ${cls||''}" id="ch-${id}"></div></div>`;
}
function buildSkeleton(){
 const D=window.D22;
 const S=window.QUOTES22;
 const qHTML=sec=>S.filter(q=>q.sec===sec).map(q=>`<div class="quote"><div class="qt">«${q.text}»</div><div class="qa"><b>${q.name}</b> — ${q.role}</div></div>`).join('');
 let html='';

 // ===== АУДИТОРИЯ =====
 html+=secHtml('aud','§1',T('Аудитория','Audience'),T('Кто и как играл в 2022-м','Who played in 2022'),
  ['Частота игры и динамика времени. База — все 1600 респондентов (частота) и играющие 966 (динамика).','Play frequency and playtime dynamics. Base: all 1,600 respondents (frequency); 966 players (dynamics).'],
  `<div class="grid g2">
    ${cardHtml('freq')}${cardHtml('trend')}
   </div>
   <div class="grid g2">
    ${cardHtml('hours')}${cardHtml('devices')}
   </div>`+qHTML('intro'));

 // ===== ПРИВЫЧКИ/СПОРТ =====
 html+=secHtml('habit','§2',T('Привычки и спорт','Habits & sport'),T('Игровые привычки, спорт и зрительство','Gaming habits, physical activity, spectating'),
  ['Киберспорт был задуман как «спорт spectators». Смотрим, как играющие сочетают игру и физическую активность.','Esports was conceived as a spectator sport. How players combine gaming and physical activity.'],
  `<div class="grid g2">${cardHtml('sportform')}${cardHtml('sportwatch')}</div>`+qHTML('habit'));

 // ===== ДЕНЬГИ =====
 html+=secHtml('money','§3',T('Деньги','Spending'),T('Траты на игры и внутри игр','Spending on games and in games'),
  ['Покупки игр за год и траты внутри игр за месяц. Рублёвые суммы — медианы (устойчивы к выбросам).','Purchases of games in the past year; in-game spending in the past month. Ruble amounts are medians (robust to outliers).'],
  `<div class="grid g2">${cardHtml('bought')}${cardHtml('spendbar')}${cardHtml('ingame')}${cardHtml('ingspend')}</div>`+qHTML('money'));

 // ===== СЕМЬЯ И СТЕРЕОТИПЫ =====
 html+=secHtml('family','§4',T('Семья и стереотипы','Family & stereotypes'),T('Семейный гейминг и общественное мнение','Family gaming and public opinion'),
  ['Семейный контекст (опрос у всех, включая неиграющих) и пары стереотипов. Для каждой пары — выбор первого утверждения по текущему разрезу.','Family context (asked of all, incl. non-players) and paired stereotypes. Each chart shows the share choosing the first statement.'],
  `<div class="grid g2">${cardHtml('famgame')}${cardHtml('agree')}</div>
   <div class="grid g2">${cardHtml('agree2')}${cardHtml('stereo')}</div>`+qHTML('family')+qHTML('stereo'));

 // ===== КИБЕРСПОРТ =====
 html+=secHtml('esport','§5',T('Киберспорт','Esports'),T('Знание и отношение','Awareness and attitudes'),
  ['Знают ли киберспорт и как оценивают признание его видом спорта. База — все 1600.','Awareness of esports and attitudes to its official recognition. Base: all 1,600.'],
  `<div class="grid g2">${cardHtml('esknow')}${cardHtml('esoff')}</div>`+qHTML('esport'));

 // ===== СКРЫТЫЕ ЗАКОНОМЕРНОСТИ =====
 html+=`<section id="sec-hidden"><h2><span class="num">§6</span>${T('Скрытые закономерности данных','Hidden patterns in the data')}</h2>
 <p class="secdesc">${T('Находки, которых нет в отчёте: контрасты между разрезами, которые отчёт не подсвечивал.','Findings not highlighted in the report: contrasts between breakdowns the report did not surface.')}</p>
 <div id="findings"></div></section>`;
 document.getElementById('sections').innerHTML=html;
}

/* ---------- chart builders ---------- */
function cutIdx(){return document.getElementById('fCut').value}

function renderFindings(){
 const D=window.D22;const cut=curCut();
 const F=D.freq;
 const gam=c=>F.often[c].map((v,i)=>v+F.weekly[c][i]+F.episodic[c][i]);
 const gIncome=gam('income'), gEdu=gam('edu'), gAge=gam('age');
 const find=[
  {t:T('1. Стереотипы — женский феномен','1. Stereotypes skew female'),
   p:T('Женщины заметно чаще мужчин соглашаются с негативными утверждениями об играх: «вредят здоровью» — 76% против 67% у мужчин, «делают агрессивнее» — 61% против 44%, «теряют навыки общения» — 70% против 55%. При этом сами женщины играют не меньше мужчин (55% против 51%) и чаще стали играть за год. Игры осуждает в первую очередь та группа, которая в них играет.',
     'Women agree with negative statements about games noticeably more often than men: "harm health" 76% vs 67%, "make aggressive" 61% vs 44%, "lose social skills" 70% vs 55%. Yet women play about as much as men (55% vs 51%) — the most critical group is a gaming group itself.')},
  {t:T('2. Обеспеченные чаще признают зависимость','2. Wealthier admit control problems'),
   p:T('Среди играющих с хорошим материальным положением 35% признают, что им сложно контролировать время в играх, — против 20% у «удовлетворительного» (и 23% у «плохого»). Тот же градиент у конфликтов с семьёй (24% против 19% и 12%) и намерения тратить больше (22% против 8%): вовлечённость и траты растут вместе с доходом, и «проблема контроля» — маркер вовлечённого гейминга, а не бедности.',
     'Among players with a good material situation, 35% admit difficulty controlling their gaming time — vs 20% of the "satisfactory" group (and 23% of the "poor"). The same gradient appears for family conflicts (24% vs 19% and 12%) and intent to spend more (22% vs 8% and 14%): engagement and spending rise with income — "control problems" mark engaged gaming, not poverty.')},
  {t:T('3. Киберспорт знает не молодёжь, а «двухполюсная» аудитория','3. Esports awareness is not a youth story'),
   p:T('«Хорошо знаю, что такое киберспорт» — 45% среди 18–24 и всего 3% в 55+, но среди 25–34 — лишь 25%. Зато признание киберспорта видом спорта резко падает с возрастом (68% → 38%) и сильнее всего поддержано на Урале и в Сибири/на Дальнем Востоке (63% и 62%) — там, где сильна «серьёзная» спортивная традиция.',
     '"Know esports well" is 45% among 18–24 but only 25% among 25–34 and 3% at 55+. Official recognition as a sport, however, declines monotonically with age (68% → 38%) and peaks in the Urals and Siberia/Far East (63% and 62%).')},
  {t:T('4. Образование — минус, доход — плюс','4. Education ↓, income ↑'),
   p:T('Среди людей без высшего образования играют 63%, с высшим — 55%. Но среди обеспеченных играют 67%, среди «удовлетворительных» — 59%. Гейминг в 2022-м — не «элитарное хобби»: он смещён к аудитории с доходом выше среднего, но без высокой формальной образованности.',
     '63% of those without higher education play vs 55% with a degree; but 67% of the financially comfortable play vs 59% of the "satisfactory". In 2022 gaming skewed toward above-average income, not formal education.')},
  {t:T('5. Рабочие играют дольше всех','5. Blue-collar players spend the most time'),
